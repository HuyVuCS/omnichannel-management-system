# Local development stack.
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d                 # infra only
#   docker compose -f docker/docker-compose.yml --env-file docker/.env --profile app up -d   # infra + API
name: omnichannel

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OMNI_DB_NAME: omnichannel
      OMNI_MIGRATOR_PASSWORD: ${OMNI_MIGRATOR_PASSWORD:?OMNI_MIGRATOR_PASSWORD is required}
      OMNI_APP_PASSWORD: ${OMNI_APP_PASSWORD:?OMNI_APP_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost forces TCP, so the check only passes after init scripts finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d omnichannel"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # S3-compatible object storage for development only (product images): SeaweedFS, everything in one process.
  # Production uses a hosted S3-compatible provider (task 025); the application only knows the S3 API.
  # Bucket, access key and CORS are start-up settings of the container, so there is no init step, and starting it again
  # changes nothing: the bucket is created only when it does not exist. The bucket is private - every request needs a
  # signature of the key below.
  objectstorage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -bucket=${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      # Browsers upload and read with presigned links: the origins of the dev server and of `vite preview`, under both
      # names a developer may open them with (an origin is compared as text: localhost is not 127.0.0.1).
      - -s3.allowedOrigins=http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required (scripts/setup-object-storage.ps1)}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required (scripts/setup-object-storage.ps1)}
    ports:
      # The S3 API only; master, volume and filer ports stay inside the container.
      - "127.0.0.1:8333:8333"
    volumes:
      - objectstorage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: ../docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=omnichannel;Username=omnichannel_app;Password=${OMNI_APP_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Reached from inside the compose network. Links the containerised API hands out carry this address, which a
      # browser on the host cannot resolve: images work with the API run from the IDE (README "Product images").
      ObjectStorage__ServiceUrl: http://objectstorage:8333
      ObjectStorage__BucketName: ${OBJECT_STORAGE_BUCKET}
      ObjectStorage__AccessKeyId: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      ObjectStorage__SecretAccessKey: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  rabbitmq-data:
  objectstorage-data:
