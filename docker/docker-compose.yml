# Local development stack.
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d                 # infra only
#   docker compose -f docker/docker-compose.yml --env-file docker/.env --profile app up -d   # infra + API
name: omnichannel

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OMNI_DB_NAME: omnichannel
      OMNI_MIGRATOR_PASSWORD: ${OMNI_MIGRATOR_PASSWORD:?OMNI_MIGRATOR_PASSWORD is required}
      OMNI_APP_PASSWORD: ${OMNI_APP_PASSWORD:?OMNI_APP_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost forces TCP, so the check only passes after init scripts finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d omnichannel"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: ../docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=omnichannel;Username=omnichannel_app;Password=${OMNI_APP_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  rabbitmq-data:
