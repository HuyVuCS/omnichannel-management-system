# Production stack: everything on one machine, one entry (the reverse proxy). docs/operations-guide.md "Production deployment".
#
#   powershell -ExecutionPolicy Bypass -File scripts\deploy\new-prod-env.ps1 -AdminEmail you@example.com   # once: docker/.env.prod
#   docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml build
#   docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d --wait postgres
#   docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml --profile migrate run --rm migrate
#   docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d --wait
#
# Without TLS (default): the proxy listens on 127.0.0.1 only, API on API_PORT and storage on STORAGE_PORT, plain HTTP;
# a tunnel on this machine ends TLS in front of it. With TLS on a machine that has public names: add
# -f docker/docker-compose.prod.tls.yml and set API_SITE_ADDRESS / STORAGE_SITE_ADDRESS to the two host names.
#
# The images of this stack are omnichannel-api / -workers / -migrate:IMAGE_TAG, and IMAGE_TAG is a line of the
# environment file (production: the short commit of the release) - never a shell variable, so "up" cannot quietly
# switch to other images and two stacks on one machine never share a tag. docs/runbook.md "Release".
#
# The images this project does not build (postgres, rabbitmq, seaweedfs, caddy) are pinned by digest - tag@sha256, the
# tag is for the reader, the digest decides: no pull and no reset of Docker can bring another build of the same tag.
# A new one is a release that changes the digest here. docs/runbook.md "Updating a third-party image".
#
# No value in this file is a secret: every password and key comes from the environment file, which is never committed.
name: omnichannel-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The commit an image was built from (release: set GIT_COMMIT before "build"); the backup manifest records it.
x-revision: &revision
  org.opencontainers.image.revision: ${GIT_COMMIT:-unknown}

# Every service: no process gains privileges it was not started with, and no capability beyond the ones a service adds
# back by name (measured in task 026: what its start-up fails without). docs/runbook.md "Containers".
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-object-storage: &object-storage
  ObjectStorage__ServiceUrl: http://objectstorage:8333
  ObjectStorage__BucketName: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
  ObjectStorage__AccessKeyId: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
  ObjectStorage__SecretAccessKey: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}

services:
  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    <<: *hardening
    # The entrypoint starts as root, takes the data directory and the socket directory for the postgres user and
    # switches to it. Without one of the five the start fails or leaves "Operation not permitted" behind. The root
    # file system stays writable: the operating scripts copy statement and dump files into the container.
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OMNI_DB_NAME: omnichannel
      OMNI_MIGRATOR_PASSWORD: ${OMNI_MIGRATOR_PASSWORD:?OMNI_MIGRATOR_PASSWORD is required}
      OMNI_APP_PASSWORD: ${OMNI_APP_PASSWORD:?OMNI_APP_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      # -h localhost forces TCP, so the check only passes after init scripts finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d omnichannel"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    logging: *logging

  rabbitmq:
    # The management UI is in the image but no port of this service is published.
    image: rabbitmq:4-management@sha256:ddc75301edf58a8332934cf2d801be7cbf8d65c6458d747364a8046238ff1c89
    restart: unless-stopped
    <<: *hardening
    # The broker's own user from the start (the image allows it): no capability is needed, and the health check and
    # "exec" run as the user that may read the node's cookie.
    user: rabbitmq
    read_only: true
    tmpfs:
      - /tmp
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # The memory the broker may count on = mem_limit below (it cannot see the limit of its container).
      - ./rabbitmq/20-memory.conf:/etc/rabbitmq/conf.d/20-memory.conf:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 1g
    logging: *logging

  # S3-compatible object storage (SeaweedFS, everything in one process): product images and export files. The bucket is
  # private - every request needs a signature. Browsers reach it through the proxy's storage site only.
  objectstorage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    <<: *hardening
    # The image's "seaweed" user (1000:1000) from the start, instead of an entrypoint that begins as root. The volume
    # must belong to it: a new one does; one written by an older start is fixed once (docs/runbook.md "Containers").
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    command:
      - mini
      - -dir=/data
      - -bucket=${OBJECT_STORAGE_BUCKET}
      # Browsers upload and read with presigned links from the frontend: its origin, exactly as the browser sends it.
      - -s3.allowedOrigins=${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - objectstorage-data:/data
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    logging: *logging

  # One-shot: applies the pending migrations as the migrator role and exits. Run it before "up" (see the top of this file).
  migrate:
    profiles: ["migrate"]
    build:
      context: ../backend
      dockerfile: ../docker/migrate.Dockerfile
      labels: *revision
    image: omnichannel-migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: "no"
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The bundle unpacks its libraries before it runs: into the temporary file system (the root is read-only).
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp
      OMNICHANNEL_MIGRATOR_CONNECTION: "Host=postgres;Port=5432;Database=omnichannel;Username=omnichannel_migrator;Password=${OMNI_MIGRATOR_PASSWORD}"
    networks: [backend]
    mem_limit: 512m
    logging: *logging

  api:
    build:
      context: ../backend
      dockerfile: ../docker/api.Dockerfile
      labels: *revision
    image: omnichannel-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      objectstorage:
        condition: service_healthy
    environment:
      <<: *object-storage
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=omnichannel;Username=omnichannel_app;Password=${OMNI_APP_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Presigned links are signed for the origin the browsers reach (the proxy's storage site).
      ObjectStorage__PublicServiceUrl: ${STORAGE_PUBLIC_URL:?STORAGE_PUBLIC_URL is required}
      # The one origin the browsers call this API from.
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      # Client address and scheme are taken from the proxy, and from nobody else.
      ReverseProxy__KnownProxies__0: ${PROXY_IP:-172.30.250.2}
      # TLS ends at the edge. A request that got there without TLS is redirected to HTTPS; API_HTTPS_REDIRECT=false is
      # for a stack that has no TLS anywhere (a local run).
      ASPNETCORE_HTTPS_PORT: "443"
      ReverseProxy__RedirectToHttps: ${API_HTTPS_REDIRECT:-true}
      Webhooks__Channels__website__Secrets__0: ${WEBHOOK_SECRET_WEBSITE:?WEBHOOK_SECRET_WEBSITE is required}
      Webhooks__Channels__pos__Secrets__0: ${WEBHOOK_SECRET_POS:?WEBHOOK_SECRET_POS is required}
      Webhooks__Channels__digital-platform__Secrets__0: ${WEBHOOK_SECRET_DIGITAL_PLATFORM:?WEBHOOK_SECRET_DIGITAL_PLATFORM is required}
    networks: [backend, edge]
    healthcheck:
      # The image has neither curl nor wget: bash opens the socket itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    logging: *logging

  # WORKERS_REPLICAS instances (up -d --scale workers=N overrides it for that one command). Every instance has its own
  # id in the attempt history (its container host name).
  workers:
    deploy:
      replicas: ${WORKERS_REPLICAS:-1}
    build:
      context: ../backend
      dockerfile: ../docker/workers.Dockerfile
      labels: *revision
    image: omnichannel-workers:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      objectstorage:
        condition: service_healthy
    environment:
      <<: *object-storage
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=omnichannel;Username=omnichannel_app;Password=${OMNI_APP_PASSWORD}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    networks: [backend]
    mem_limit: 768m
    logging: *logging

  # The only service with host ports.
  proxy:
    image: caddy:2.11@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    <<: *hardening
    # Not root: its ports (8080, 8081, 8090) need no privilege. NET_BIND_SERVICE is added back only because the binary
    # of the image carries that file capability and the kernel refuses to start it otherwise ("operation not permitted").
    user: "65532:65532"
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    # Caddy's state directories. Without TLS nothing in them has to survive a restart (docker-compose.prod.tls.yml
    # puts volumes there for the certificates).
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
      - /config:uid=65532,gid=65532,mode=0700
    depends_on:
      api:
        condition: service_healthy
      objectstorage:
        condition: service_healthy
    environment:
      API_SITE_ADDRESS: ${API_SITE_ADDRESS:-http://:8080}
      STORAGE_SITE_ADDRESS: ${STORAGE_SITE_ADDRESS:-http://:8081}
      PROXY_TRUSTED_PROXIES: ${PROXY_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
      - "${PROXY_BIND:-127.0.0.1}:${STORAGE_PORT:-8081}:8081"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        ipv4_address: ${PROXY_IP:-172.30.250.2}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 128m
    logging: *logging

networks:
  # Database, broker, storage and the two hosts: no way out and no host port.
  backend:
    internal: true
  # The proxy and what it serves. The proxy has a fixed address, which is the only one the API believes forwarded
  # headers from; the other containers get theirs from the upper half of the subnet.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.250.0/28}
          # What reaches the proxy through its host ports (a tunnel on this machine) arrives from this address.
          gateway: ${EDGE_GATEWAY:-172.30.250.1}
          ip_range: ${EDGE_DYNAMIC_RANGE:-172.30.250.8/29}

volumes:
  postgres-data:
  rabbitmq-data:
  objectstorage-data:
