# RabbitMQ of the production stack (docker-compose.prod.yml), mounted read-only as /etc/rabbitmq/conf.d/20-memory.conf.
#
# The broker does not see the memory limit of its container (mem_limit: 1g): it reads the memory of the machine - on
# Docker Desktop the whole virtual machine - and would only slow publishers down (high watermark, 0.6 of it) far above
# the point where the container is killed. This is the limit of the compose file; change the two together.
total_memory_available_override_value = 1GiB
